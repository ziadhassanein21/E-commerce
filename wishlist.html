<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My Wishlist — L'Essence Luxury Perfumes">
    <title>Wishlist — L'Essence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

    
    <div class="announcement-bar" id="announcement-bar">
        <button class="btn-close-banner" id="close-announcement">&times;</button>
    </div>

    
    <nav class="navbar navbar-expand-lg navbar-luxury fixed-top" id="main-navbar"></nav>

    
    <section class="wishlist-section">
        <div class="container">
            <div class="section-title">
                <h2>My Wishlist</h2>
                <p>Your saved fragrances</p>
            </div>

            <div id="wishlist-content"></div>
        </div>
    </section>

    
    <footer class="footer-luxury" id="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { Auth, Cart, UI, Products, Wishlist } from './js/app.js';

        Auth.protect();

        function renderWishlist() {
            let container = document.getElementById('wishlist-content');
            let wishIds = Wishlist.getItems();

            if (wishIds.length === 0) {
                container.innerHTML = `
                    <div class="wishlist-empty">
                        <i class="bi bi-heart"></i>
                        <h3>Your wishlist is empty</h3>
                        <p>Browse our collection and heart the fragrances you love.</p>
                        <a href="index.html#collection" class="btn btn-gold"><span>Explore Collection</span></a>
                    </div>`;
                return;
            }

            let html = '<div class="row g-4">';
            wishIds.forEach(id => {
                let p = Products.getById(id);
                if (!p) return;
                let inWish = Wishlist.contains(p.id);
                html += `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="product-card">
                        <div class="product-card-img">
                            <img src="${p.images[0]}" alt="${p.name}">
                            <button class="btn-wishlist ${inWish ? 'active' : ''}"
                                    data-wishlist-id="${p.id}"
                                    onclick="window.toggleWish(${p.id})">
                                <i class="bi bi-heart-fill"></i>
                            </button>
                            <div class="product-card-overlay">
                                <a href="product.html?id=${p.id}" class="btn-view">View Details</a>
                            </div>
                        </div>
                        <div class="product-card-body">
                            <div class="brand">${p.brand}</div>
                            <h5>${p.name}</h5>
                            <div class="rating">${UI.starsHTML(p.rating)}</div>
                            <div class="price">${UI.formatPrice(p.price)}</div>
                            <button class="btn-add-cart" onclick="window.addToCart(${p.id}, ${p.volumes[0]})">
                                <i class="bi bi-bag-plus me-2"></i>Add to Cart
                            </button>
                        </div>
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }
        window.toggleWish = (id) => {
            Wishlist.toggle(id);
            renderWishlist();
        };
        window.addToCart = (id, vol) => {
            Cart.addItem(id, vol);
        };

        renderWishlist();
    </script>
</body>

</html>
