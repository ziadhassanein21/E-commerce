<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to L'Essence — Luxury Perfume E-Commerce">
    <title>Login — L'Essence</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
        <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="auth-wrapper">
    
    <div class="auth-image"></div>

    
    <div class="auth-form-side">
        <div class="auth-form-container">
            <div class="auth-logo">L'Essence</div>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to continue your fragrance journey.</p>

            <div id="login-alert" class="alert d-none" role="alert"></div>

            <form id="login-form" class="auth-form" novalidate>
                <div class="mb-3">
                    <label for="login-email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="login-email" placeholder="you@example.com" required>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <div class="mb-3">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
                    <div class="invalid-feedback">Password is required.</div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember-me">
                    <label class="form-check-label" for="remember-me">Remember Me</label>
                </div>

                <button type="submit" class="btn btn-gold"><span>Sign In</span></button>

                <div class="auth-link">
                    Don't have an account? <a href="register.html">Create one</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { Auth } from '../js/app.js';
    if (Auth.isLoggedIn()) {
        window.location.href = 'index.html';
    }

    let form = document.getElementById('login-form');
    let alertBox = document.getElementById('login-alert');

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        let email = document.getElementById('login-email');
        let password = document.getElementById('login-password');
        let remember = document.getElementById('remember-me').checked;
        email.classList.remove('is-invalid');
        password.classList.remove('is-invalid');
        alertBox.classList.add('d-none');

        let valid = true;
        if (!email.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
            email.classList.add('is-invalid');
            valid = false;
        }
        if (!password.value) {
            password.classList.add('is-invalid');
            valid = false;
        }

        if (!valid) return;
        let result = Auth.login(email.value, password.value, remember);
        if (result.success) {
            window.location.href = 'index.html';
        } else {
            alertBox.className = 'alert alert-danger';
            alertBox.textContent = result.message;
        }
    });
</script>
</body>
</html>
