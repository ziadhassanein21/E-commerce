<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your Shopping Cart — L'Essence Luxury Perfumes">
    <title>Cart — L'Essence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    
    <nav class="navbar navbar-expand-lg navbar-luxury fixed-top" id="main-navbar"></nav>

    
    <section class="cart-section">
        <div class="container">
            <div class="section-title" style="margin-bottom:30px;">
                <h2>Shopping Cart</h2>
            </div>
            <div id="cart-content"></div>
        </div>
    </section>

    
    <footer class="footer-luxury" id="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { Auth, Cart, UI, Products } from '../js/app.js';

        Auth.protect();

        let cartContent = document.getElementById('cart-content');

        function renderCart() {
            let items = Cart.getItems();

            if (items.length === 0) {
                cartContent.innerHTML = `
                    <div class="cart-empty">
                        <i class="bi bi-bag-x"></i>
                        <h3>Your Cart is Empty</h3>
                        <p>Looks like you haven't added any fragrances yet. Explore our collection.</p>
                        <a href="index.html#collection" class="btn btn-gold"><span>Continue Shopping</span></a>
                    </div>`;
                return;
            }

            let itemsHTML = '';
            items.forEach((item, index) => {
                let product = Products.getById(item.productId);
                if (!product) return;

                let subtotal = product.price * item.qty;
                itemsHTML += `
                    <div class="cart-item" data-index="${index}">
                        <img src="${product.images[0]}" alt="${product.name}">
                        <div class="cart-item-info">
                            <h5>${product.name}</h5>
                            <span class="volume-label">${item.volume}ml</span>
                            <div class="unit-price">${UI.formatPrice(product.price)} each</div>
                        </div>
                        <div class="quantity-selector" style="margin-bottom:0;">
                            <button class="qty-dec" data-index="${index}">−</button>
                            <input type="number" value="${item.qty}" min="1" readonly>
                            <button class="qty-inc" data-index="${index}">+</button>
                        </div>
                        <div class="item-subtotal">${UI.formatPrice(subtotal)}</div>
                        <button class="btn-remove" data-index="${index}" title="Remove"><i class="bi bi-x-lg"></i></button>
                    </div>`;
            });

            let subtotal = Cart.getSubtotal();
            let shipping = Cart.getShipping();
            let total = Cart.getTotal();

            cartContent.innerHTML = `
                <div class="row g-4">
                    <div class="col-lg-8">
                        ${itemsHTML}
                        <div class="mt-3">
                            <a href="index.html#collection" class="btn btn-outline-gold"><i class="bi bi-arrow-left me-2"></i>Continue Shopping</a>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="cart-summary">
                            <h4>Order Summary</h4>
                            <div class="summary-row">
                                <span>Subtotal</span>
                                <span>${UI.formatPrice(subtotal)}</span>
                            </div>
                            <div class="summary-row">
                                <span>Shipping</span>
                                <span>${shipping === 0 ? '<span class="text-gold">Free</span>' : UI.formatPrice(shipping)}</span>
                            </div>
                            ${subtotal > 0 && subtotal < 75 ? `<div class="summary-row"><small class="text-muted">Free shipping on orders over $75</small></div>` : ''}
                            <div class="summary-row total">
                                <span>Total</span>
                                <span>${UI.formatPrice(total)}</span>
                            </div>
                            <a href="checkout.html" class="btn btn-gold"><span>Proceed to Checkout</span></a>
                        </div>
                    </div>
                </div>`;
            cartContent.querySelectorAll('.qty-dec').forEach(btn => {
                btn.addEventListener('click', () => {
                    let idx = parseInt(btn.dataset.index);
                    let currentItems = Cart.getItems();
                    Cart.updateQty(idx, currentItems[idx].qty - 1);
                    renderCart();
                });
            });

            cartContent.querySelectorAll('.qty-inc').forEach(btn => {
                btn.addEventListener('click', () => {
                    let idx = parseInt(btn.dataset.index);
                    let currentItems = Cart.getItems();
                    Cart.updateQty(idx, currentItems[idx].qty + 1);
                    renderCart();
                });
            });

            cartContent.querySelectorAll('.btn-remove').forEach(btn => {
                btn.addEventListener('click', () => {
                    Cart.removeItem(parseInt(btn.dataset.index));
                    renderCart();
                });
            });
        }

        renderCart();
    </script>
</body>

</html>
