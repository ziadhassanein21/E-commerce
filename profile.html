<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My Profile — L'Essence Luxury Perfumes">
    <title>My Profile — L'Essence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

    
    <div class="announcement-bar" id="announcement-bar">
        <button class="btn-close-banner" id="close-announcement">&times;</button>
    </div>

    
    <nav class="navbar navbar-expand-lg navbar-luxury fixed-top" id="main-navbar"></nav>

    
    <section class="profile-section">
        <div class="container">
            <div class="row g-4">
                
                <div class="col-lg-4">
                    <div class="profile-card" id="profile-card"></div>
                    <div class="d-grid gap-2">
                        <a href="wishlist.html" class="btn btn-outline-gold" style="padding:12px;">
                            <i class="bi bi-heart me-2"></i>My Wishlist
                        </a>
                    </div>
                </div>

                
                <div class="col-lg-8">
                    <div class="order-history">
                        <div class="order-history-header">
                            <i class="bi bi-clock-history me-2"></i>Order History
                        </div>
                        <div id="order-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    
    <footer class="footer-luxury" id="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { Auth, Cart, UI, Products, Wishlist, Orders } from './js/app.js';

        Auth.protect();

        let user = Auth.getUser();
        function renderProfile() {
            let initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase();
            let orders = Orders.getAll();
            let wishCount = Wishlist.getCount();
            let totalSpent = orders.reduce((sum, o) => sum + (o.total || 0), 0);

            document.getElementById('profile-card').innerHTML = `
                <div class="profile-avatar">${initials}</div>
                <h4>${user.name}</h4>
                <p>${user.email}</p>
                <div class="profile-stats">
                    <div class="stat">
                        <div class="stat-num">${orders.length}</div>
                        <div class="stat-label">Orders</div>
                    </div>
                    <div class="stat">
                        <div class="stat-num">${wishCount}</div>
                        <div class="stat-label">Wishlist</div>
                    </div>
                    <div class="stat">
                        <div class="stat-num">${UI.formatPrice(totalSpent)}</div>
                        <div class="stat-label">Total Spent</div>
                    </div>
                </div>`;
        }
        function renderOrders() {
            let orders = Orders.getAll();
            let container = document.getElementById('order-list');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="no-orders">
                        <i class="bi bi-bag-x"></i>
                        <h5>No orders yet</h5>
                        <p>Your order history will appear here after your first purchase.</p>
                        <a href="index.html#collection" class="btn btn-gold mt-3"><span>Start Shopping</span></a>
                    </div>`;
                return;
            }

            container.innerHTML = orders.map(order => {
                let date = new Date(order.date);
                let formattedDate = date.toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
                let itemCount = order.items ? order.items.length : 0;
                let statusClass = order.status.toLowerCase();

                return `
                    <div class="order-item">
                        <div>
                            <div class="order-id">${order.orderId}</div>
                            <div class="order-date">${formattedDate} · ${itemCount} item${itemCount !== 1 ? 's' : ''}</div>
                        </div>
                        <div class="order-total">${UI.formatPrice(order.total)}</div>
                        <span class="order-status ${statusClass}">${order.status}</span>
                    </div>`;
            }).join('');
        }

        renderProfile();
        renderOrders();
    </script>
</body>

</html>
