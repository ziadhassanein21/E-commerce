<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your L'Essence account — Luxury Perfume E-Commerce">
    <title>Register — L'Essence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

    <div class="auth-wrapper">
        
        <div class="auth-image"></div>

        
        <div class="auth-form-side">
            <div class="auth-form-container">
                <div class="auth-logo">L'Essence</div>
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join us and discover the world of fine fragrance.</p>

                <div id="register-alert" class="alert d-none" role="alert"></div>

                <form id="register-form" class="auth-form" novalidate>
                    <div class="mb-3">
                        <label for="reg-name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="reg-name" placeholder="John Doe" required>
                        <div class="invalid-feedback">Please enter your full name.</div>
                    </div>

                    <div class="mb-3">
                        <label for="reg-email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="you@example.com" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>

                    <div class="mb-3">
                        <label for="reg-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="reg-password" placeholder="Min 6 characters"
                            required>
                        <div class="invalid-feedback">Password must be at least 6 characters.</div>
                    </div>

                    <div class="mb-3">
                        <label for="reg-confirm" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="reg-confirm" placeholder="Re-enter password"
                            required>
                        <div class="invalid-feedback">Passwords do not match.</div>
                    </div>

                    <button type="submit" class="btn btn-gold"><span>Create Account</span></button>

                    <div class="auth-link">
                        Already have an account? <a href="login.html">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { Auth } from './js/app.js';
        if (Auth.isLoggedIn()) {
            window.location.href = 'index.html';
        }

        let form = document.getElementById('register-form');
        let alertBox = document.getElementById('register-alert');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            let name = document.getElementById('reg-name');
            let email = document.getElementById('reg-email');
            let password = document.getElementById('reg-password');
            let confirm = document.getElementById('reg-confirm');
            [name, email, password, confirm].forEach(el => el.classList.remove('is-invalid'));
            alertBox.classList.add('d-none');

            let valid = true;

            if (!name.value.trim()) {
                name.classList.add('is-invalid');
                valid = false;
            }

            if (!email.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                email.classList.add('is-invalid');
                valid = false;
            }

            if (!password.value || password.value.length < 6) {
                password.classList.add('is-invalid');
                valid = false;
            }

            if (password.value !== confirm.value) {
                confirm.classList.add('is-invalid');
                valid = false;
            }

            if (!valid) return;

            let result = Auth.register(name.value.trim(), email.value, password.value);
            if (result.success) {
                window.location.href = 'index.html';
            } else {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = result.message;
            }
        });
    </script>
</body>

</html>
